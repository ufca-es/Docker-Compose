apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f compose.yaml convert -o kubernetes-gerado
    kompose.service.nodeport.port: "30080"
    kompose.service.type: nodeport
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: web
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: web
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f compose.yaml convert -o kubernetes-gerado
        kompose.service.nodeport.port: "30080"
        kompose.service.type: nodeport
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: web
    spec:
      containers:
        - image: nginx:1.27-alpine
          name: web
          ports:
            - containerPort: 80
              protocol: TCP
      restartPolicy: Always
